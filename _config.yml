breadcrumbs: false
words_per_minute: 180
future: false
read_more: disabled
talkmap_link: false
comments:
  provider: false
analytics:
  provider: false
atom_feed:
  hide: true

include:
  - _pages
  - files
exclude:
  - .bundle
  - .github
  - .sass-cache
  - .jekyll-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - node_modules
  - tools
  - package.json
  - package-lock.json
  - _site

encoding: utf-8
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  entity_output: as_char
  toc_levels: 2..3

collections:
  publications:
    output: true
  talks:
    output: true
  teaching:
    output: true
  portfolio:
    output: true

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      comments: false
      share: false

sass:
  sass_dir: _sass
  style: compressed
permalink: /:categories/:title/
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

compress_html:
  clippings: all
  ignore:
    envs: development
